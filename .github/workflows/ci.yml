name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Byte-compile the app
        run: python -m compileall -q app.py

      - name: Run tests
        run: pytest -v

      - name: Boot the server and hit /healthz
        run: |
          PORT=8000 gunicorn app:app --bind 127.0.0.1:8000 --workers 1 --daemon --pid /tmp/app.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then break; fi
            sleep 1
          done
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/openbot)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/piggybank)" = "200"
          echo "smoke test passed"
          kill "$(cat /tmp/app.pid)"
