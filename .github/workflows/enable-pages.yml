# Temporary helper: enabling GitHub Pages needs repo-admin rights that the
# external bot token does not have, but a workflow's own GITHUB_TOKEN can
# request them. Delete this file once Pages is enabled.
name: Enable GitHub Pages

on:
  push:
    branches: ["arena/01a0e933-opennet"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  administration: write

jobs:
  enable:
    name: Enable Pages with the Actions build type
    runs-on: ubuntu-latest
    steps:
      - name: Create the Pages site
        id: enable
        run: |
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "POST /pages -> HTTP $code"
          cat /tmp/resp.json || true
          echo
          case "$code" in
            201) echo "result=created"  >> "$GITHUB_OUTPUT" ;;
            409) echo "result=exists"   >> "$GITHUB_OUTPUT" ;;
            *)   echo "result=failed"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Report
        run: |
          case "${{ steps.enable.outputs.result }}" in
            created) echo "GitHub Pages was created with the Actions build type." ;;
            exists)  echo "GitHub Pages was already enabled." ;;
            failed)
              echo "::error::Could not enable GitHub Pages. Open Settings -> Pages and set Source to 'GitHub Actions' manually."
              exit 1 ;;
          esac

      - name: Read back the Pages settings
        if: steps.enable.outputs.result != 'failed'
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("status:", d.get("status")); print("url:", d.get("html_url")); print("build_type:", (d.get("build_type") or "n/a"))'
