# Builds the OpenNet Docker image and pushes it to Amazon ECR.
#
# This workflow is OPT-IN and manual (workflow_dispatch) so it never fails on a
# normal push. Every step is skipped unless the repository has real AWS values
# configured - the shipped MY_* placeholders are not real resources.
#
# To enable it:
#   1. aws ecr create-repository --repository-name opennet --region us-east-2
#   2. Create an ECS cluster, service and task definition.
#   3. Set the env values below and add the AWS_ACCESS_KEY_ID /
#      AWS_SECRET_ACCESS_KEY repository secrets.
#   4. Actions -> "Build and push image to Amazon ECR" -> Run workflow.

name: Build and push image to Amazon ECR

on:
  workflow_dispatch:

env:
  AWS_REGION: MY_AWS_REGION         # e.g. us-east-2
  ECR_REPOSITORY: MY_ECR_REPOSITORY # e.g. opennet

permissions:
  contents: read

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AWS configuration
        id: config
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$KEY_ID" ] || [ "$AWS_REGION" = "MY_AWS_REGION" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS is not configured for this repository - skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.config.outputs.configured == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        if: steps.config.outputs.configured == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Pushed $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
