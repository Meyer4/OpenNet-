name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v

      - name: Build the static site
        run: python build_static.py --base "/${{ github.event.repository.name }}/" --out site

      - name: Check every built page resolves its assets
        run: |
          python - <<'PY'
          import pathlib, re, sys
          base = "/${{ github.event.repository.name }}/"
          # The shell templates use single quotes, the OpenBot template double.
          pattern = re.compile(r"""(?:href|src)=["']([^"']+)["']""")
          checked = 0
          ok = True
          for page in sorted(pathlib.Path("site").rglob("*.html")):
              text = page.read_text(encoding="utf-8")
              for url in pattern.findall(text):
                  if url.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  checked += 1
                  if not url.startswith(base):
                      print(f"{page}: {url} does not start with {base}")
                      ok = False
                  target = pathlib.Path("site") / url[len(base):].rstrip("/")
                  if "." not in url.rstrip("/").split("/")[-1]:
                      target = target / "index.html"
                  if not target.exists():
                      print(f"{page}: {url} -> missing {target}")
                      ok = False
          print(f"checked {checked} internal links")
          if not checked:
              print("no links were inspected - the pattern did not match")
              ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages is enabled
        id: pages_check
        run: |
          if curl -fsS \
               -H "Authorization: Bearer ${{ github.token }}" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository. Open Settings -> Pages, set Source to 'GitHub Actions', then re-run this workflow. The site built successfully and is waiting."
          fi

      - name: Deploy
        if: steps.pages_check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
